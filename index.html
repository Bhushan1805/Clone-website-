<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Certificate Verification | Demo</title>
<style>
:root{--ink:#25252a;--muted:#777d87;--purple:#5045e7;--line:#d4d4d4;--wash:#f7f7ff}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#fff}
header{height:104px;max-width:1100px;margin:auto;padding:18px 26px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:#34304b}.logo{width:53px;height:53px;border:5px solid #6b5aa7;border-radius:50%;display:grid;place-items:center;position:relative;color:#bd6777;font-size:28px;font-weight:bold}.logo:after{content:"";position:absolute;inset:6px;border:3px dashed #c56c80;border-radius:50%}.brandtext{font:32px Georgia,serif}.tagline{display:block;color:#b86d7d;font-size:14px;letter-spacing:.2px;margin-top:1px}
.menu{border:0;background:#f7f7f7;font-size:28px;width:56px;height:56px;border-radius:7px;cursor:pointer}
main{max-width:760px;margin:0 auto;padding:70px 22px 80px;min-height:calc(100vh - 210px)}
h1{font-size:clamp(25px,4.7vw,38px);font-weight:400;line-height:1.45;margin:0 0 72px;text-transform:uppercase;letter-spacing:.2px}
.lookup{max-width:520px;margin:0 auto;background:#f8f8ff;border:5px solid #f0effb;border-radius:21px;padding:58px clamp(20px,8vw,56px);text-align:center}
input{width:100%;height:61px;border:2px solid #222;background:#fff;border-radius:0;text-align:center;padding:0 12px;font-size:clamp(18px,4vw,25px);outline-color:#7b70ea}
.search{width:100%;height:60px;border:0;border-radius:0;background:#050505;color:#fff;font-size:24px;cursor:pointer}.search:active{opacity:.85}
.note{color:#747784;font-size:13px;line-height:1.55;margin:16px 0 0}
.message{display:none;max-width:520px;margin:20px auto 0;padding:13px 15px;border-radius:9px;font-size:14px;line-height:1.5}.bad{background:#fff0ef;color:#a52a23}
.result{display:none;max-width:575px;margin:0 auto}.result h2{text-align:center;font-weight:400;font-size:clamp(37px,7vw,54px);line-height:1.15;margin:0 0 46px}.resultbox{border:2px solid #d4d4d4;border-radius:20px;overflow:hidden}.entry{font-size:clamp(17px,3.7vw,24px);line-height:1.5;padding:25px 29px;border-bottom:1px solid #d0d0d0;overflow-wrap:anywhere}.entry:nth-child(even){background:#efefef}.entry:last-child{border-bottom:0}.status{text-align:center;color:#28753d;font-size:13px;font-weight:bold;letter-spacing:.07em;margin-bottom:15px}.back{display:block;margin:24px auto 0;border:1px solid #d2d2d2;background:white;border-radius:8px;padding:12px 22px;font-size:15px;cursor:pointer}
footer{text-align:center;padding:25px 16px 38px;font-size:20px;line-height:1.7}footer a{color:#637d8d}
@media(max-width:520px){header{height:95px;padding:15px 20px}.brandtext{font-size:28px}.logo{width:47px;height:47px}.menu{width:50px;height:50px}main{padding-top:56px}h1{margin-bottom:65px}.lookup{padding-top:55px;padding-bottom:55px}.entry{padding:21px 23px}footer{font-size:17px}}
</style></head>
<body>
<header><a class="brand" href="#" aria-label="Certificate verification demo"><span class="logo">◉</span><span><span class="brandtext">CodSoft</span><span class="tagline">Code.Create.Succeed</span></span></a><button class="menu" aria-label="Menu" onclick="document.getElementById('menuNote').hidden=!document.getElementById('menuNote').hidden">☰</button></header>
<div id="menuNote" hidden style="text-align:right;max-width:1100px;margin:-8px auto 0;padding:0 28px 12px;color:#777">Certificate Verification Demo</div>
<main>
<section id="lookupView"><h1>Certificate Verification<br>System</h1>
<div class="lookup"><form id="verifyForm"><input id="code" aria-label="Certificate code" placeholder="Enter Certificate Code" required autocomplete="off"><button class="search" type="submit">Search</button></form></div>
<p class="note" style="text-align:center">Enter your certificate code to view the available sample record.</p><div id="error" class="message bad" role="status"></div>
</section>
<section id="resultView" class="result" aria-live="polite"><div class="status">SAMPLE RECORD FOUND</div><h2>Certificate<br>Result</h2><div class="resultbox">
<div class="entry" id="student"></div><div class="entry" id="domain"></div><div class="entry" id="duration"></div><div class="entry" id="certificate"></div><div class="entry" id="start"></div><div class="entry" id="award"></div>
</div><button class="back" id="back">← Verify another code</button></section>
</main>
<footer>© 2026 · Built with<br><a href="https://www.codsoft.in/" target="_blank" rel="noreferrer">CodSoft</a></footer>
<script>
const records = {
  "51cce3e": {
    student: "Girase Abhishek Aanandsing",
    domain: "Artificial Intelligence Internship",
    duration: "4 Weeks",
    start: "25/Sep/2026",
    award: "25/Oct/2026"
  },

  "56cce7e": {
    student: "Bhushan Bharat Patil",
    domain: "Artificial Intelligence Internship",
    duration: "4 Weeks",
    start: "25/Sep/2026",
    award: "25/Oct/2026"
  },

  "60cce9e": {
    student: "Megha Arun Patil",
    domain: "Artificial Intelligence Internship",
    duration: "4 Weeks",
    start: "29/Sep/2026",
    award: "29/Oct/2026"
  }
};

const form = document.getElementById("verifyForm");
const input = document.getElementById("code");
const error = document.getElementById("error");

form.addEventListener("submit", function(e) {
  e.preventDefault();

  const code = input.value.trim().toLowerCase();
  const record = records[code];

  error.style.display = "none";

  if (!record) {
    error.textContent =
      "Certificate code not found in this demo. Please check the code and try again.";
    error.style.display = "block";
    return;
  }

  document.getElementById("student").textContent =
    "Student Name: " + record.student;

  document.getElementById("domain").textContent =
    "Domain: " + record.domain;

  document.getElementById("duration").textContent =
    "Duration: " + record.duration;

  document.getElementById("certificate").textContent =
    "Certification No: " + code;

  document.getElementById("start").textContent =
    "Starting Date: " + record.start;

  document.getElementById("award").textContent =
    "Award Date: " + record.award;

  document.getElementById("lookupView").style.display = "none";
  document.getElementById("resultView").style.display = "block";

  window.scrollTo({ top: 0, behavior: "smooth" });
});

document.getElementById("back").addEventListener("click", function() {
  document.getElementById("resultView").style.display = "none";
  document.getElementById("lookupView").style.display = "block";
  input.value = "";
  error.style.display = "none";
  window.scrollTo({ top: 0, behavior: "smooth" });
});
</script>
